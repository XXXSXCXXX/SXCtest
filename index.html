<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法构筑 - 闯关小游戏</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; color:#fff; font-family:'Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
h1 { margin:20px 0; color:#e94560; text-shadow:0 0 10px rgba(233,69,96,.5); font-size:28px; }
.container { width:100%; max-width:820px; padding:0 10px; }
.crafting { background:rgba(255,255,255,.05); border-radius:15px; padding:20px; margin-bottom:20px; border:2px solid rgba(233,69,96,.3); }
.slots { display:flex; justify-content:center; gap:10px; margin-bottom:15px; }
.slot { width:72px; height:72px; background:rgba(0,0,0,.3); border:2px dashed rgba(255,255,255,.3); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.3s; position:relative; flex-direction:column; }
.slot:hover { border-color:#e94560; }
.slot.filled { border:2px solid #e94560; background:rgba(233,69,96,.15); }
.slot .x { position:absolute; top:-6px; right:-6px; width:18px; height:18px; background:#ff4757; border-radius:50%; font-size:11px; display:none; align-items:center; justify-content:center; cursor:pointer; line-height:18px; }
.slot:hover .x { display:flex; }
.spells { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-bottom:15px; }
.spell { width:76px; height:76px; background:linear-gradient(135deg,#667eea,#764ba2); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:.3s; border:2px solid transparent; position:relative; }
.spell:hover { transform:translateY(-4px); box-shadow:0 4px 12px rgba(102,126,234,.5); border-color:#fff; }
.spell .ic { font-size:26px; }
.spell .nm { font-size:11px; margin-top:4px; }
.spell .tag { position:absolute; top:2px; right:4px; font-size:9px; padding:1px 4px; border-radius:4px; background:rgba(0,0,0,.5); }
.spell.tag-projectile .tag { color:#ff6b6b; }
.spell.tag-modifier .tag { color:#4ecdc4; }
.spell.off { opacity:.4; pointer-events:none; }
.combo { text-align:center; padding:8px; background:rgba(0,0,0,.3); border-radius:8px; margin-bottom:15px; font-size:14px; color:rgba(255,255,255,.7); }
.combo b { color:#ffd700; }
.btns { text-align:center; }
.btn { padding:10px 28px; border:none; border-radius:25px; font-size:15px; font-weight:bold; cursor:pointer; transition:.3s; margin:5px; }
.btn-go { background:linear-gradient(135deg,#e94560,#ff6b6b); color:#fff; }
.btn-go:hover { transform:scale(1.05); }
.btn-go:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.btn-back { background:rgba(255,255,255,.1); color:#fff; border:2px solid rgba(255,255,255,.3); }
.btn-back:hover { background:rgba(255,255,255,.2); }
.game-wrap { display:none; }
canvas { display:block; background:#0f0f23; border-radius:12px; border:2px solid rgba(233,69,96,.3); cursor:crosshair; width:100%; }
.hud { display:flex; justify-content:space-between; padding:12px 16px; background:rgba(0,0,0,.4); border-radius:0 0 12px 12px; margin-top:-4px; }
.hud span { font-size:14px; }
.hud b { color:#e94560; }
.msg { text-align:center; padding:16px; font-size:20px; color:#ffd700; min-height:52px; }
.help { background:rgba(255,255,255,.05); border-radius:10px; padding:14px; margin-bottom:18px; border-left:4px solid #e94560; font-size:13px; line-height:1.8; color:rgba(255,255,255,.8); }
.help h3 { color:#e94560; margin-bottom:6px; }
</style>
</head>
<body>
<h1>🧙‍♂️ 魔法构筑 - 闯关小游戏</h1>
<div class="container">
  <div class="help">
    <h3>📖 玩法</h3>
    ① 点击下方法术图标，按顺序放入法杖槽位（法术飞弹+法术增强）<br>
    ② 法术从左到右依次生效，增强效果可重复叠加<br>
    ③ 点击"开始闯关"，在战斗中<b>点击画面</b>释放魔法<br>
    ④ 消灭所有怪物即可过关！共5关，难度递增<br>
    ⑤ 怪物会发射会发射👊🏻攻击你，注意躲避！
  </div>
  <div class="crafting" id="craftUI">
    <div class="slots" id="slots"></div>
    <div class="combo" id="combo">当前组合：<b>未选择法术</b></div>
    <div class="spells" id="lib"></div>
    <div class="btns">
      <button class="btn btn-go" id="goBtn" disabled>开始闯关</button>
      <button class="btn btn-back" id="clrBtn">清空法术</button>
    </div>
  </div>
  <div class="game-wrap" id="gameUI">
    <canvas id="cv" width="800" height="500"></canvas>
    <div class="hud">
      <span>关卡：<b id="lvlTxt">1</b></span>
      <span>敌人：<b id="eneTxt">0</b></span>
      <span>生命：<b id="hpTxt">5</b></span>
      <span>组合：<b id="cmbTxt">-</b></span>
    </div>
    <div class="msg" id="msg"></div>
    <div class="btns" style="margin-bottom:20px;">
      <button class="btn btn-back" id="backBtn">返回构筑</button>
      <button class="btn btn-go" id="nextBtn" style="display:none;">下一关</button>
    </div>
  </div>
</div>
<script>
const SLOTS=5;
const SPELLS={
  projectile:{n:'飞弹',ic:'🔮',t:'projectile',baseDmg:1,baseR:6,cd:18},
  missile:{n:'导弹',ic:'🚀',t:'projectile',baseDmg:2,baseR:8,cd:30},
  fist:{n:'拳头',ic:'✊🏻',t:'projectile',baseDmg:1.5,baseR:7,cd:22},
  laser:{n:'激光',ic:'⚡',t:'projectile',baseDmg:0.5,baseR:0,cd:45},
  split:{n:'分裂',ic:'✂️',t:'modifier',dmgMult:0.7,rMult:0.7},
  homing:{n:'追踪',ic:'🎯',t:'modifier',dmgMult:1,rMult:1},
  explode:{n:'爆炸',ic:'💥',t:'modifier',dmgMult:1,rMult:1},
  freeze:{n:'冰冻',ic:'❄️',t:'modifier',dmgMult:1,rMult:1},
  power:{n:'抛瓦',ic:'⬆️',t:'modifier',dmgMult:1.25,rMult:1.25}
};
const MONSTER_TYPES=[
  {emoji:'👿',hp:1,speed:0.5,color:'#ff4444'},
  {emoji:'👻',hp:1,speed:0.4,color:'#aaaaaa'},
  {emoji:'💀',hp:2,speed:0.35,color:'#dddddd'},
  {emoji:'👽',hp:1,speed:0.6,color:'#44ff44'},
  {emoji:'🤖',hp:3,speed:0.25,color:'#888888'}
];

let wand=Array(SLOTS).fill(null);
let level=1, hp=5, maxHp=5, enemies=[], bullets=[], particles=[], lasers=[], enemyFists=[];
let running=false, animId=null, cooldown=0;
const cv=document.getElementById('cv'), cx=cv.getContext('2d');

// === 构筑界面 ===
function renderSlots(){
  const el=document.getElementById('slots'); el.innerHTML='';
  wand.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slot'+(s?' filled':'');
    d.innerHTML=s?`<div style="font-size:22px">${SPELLS[s].ic}</div><div style="font-size:10px">${SPELLS[s].n}</div><div class="x">×</div>`:'<div style="color:rgba(255,255,255,.3);font-size:12px">空</div>';
    d.onclick=()=>{if(s){wand[i]=null;refresh();}};
    el.appendChild(d);
  });
}
function renderSpellLibrary(){
  const el=document.getElementById('lib'); el.innerHTML='';
  Object.entries(SPELLS).forEach(([key,s])=>{
    const d=document.createElement('div');
    d.className=`spell tag-${s.t}`;
    d.dataset.s=key;
    d.innerHTML=`<div class="ic">${s.ic}</div><div class="nm">${s.n}</div><div class="tag">${s.t==='projectile'?'飞弹':'增强'}</div>`;
    el.appendChild(d);
  });
}
function refresh(){
  renderSlots();
  document.querySelectorAll('.spell').forEach(e=>{
    const s=SPELLS[e.dataset.s];
    let off=false;
    if(s.t==='projectile'){
      off=wand.some(w=>w&&SPELLS[w].t==='projectile');
    }
    e.classList.toggle('off',off);
  });
  const filled=wand.filter(s=>s);
  document.getElementById('combo').innerHTML=filled.length?`当前组合：<b>${filled.map(s=>SPELLS[s].n).join(' → ')}</b>`:'当前组合：<b>未选择法术</b>';
  document.getElementById('goBtn').disabled=!wand.some(s=>s&&SPELLS[s].t==='projectile');
}
document.getElementById('lib').onclick=e=>{
  const sp=e.target.closest('.spell'); if(!sp||sp.classList.contains('off'))return;
  const idx=wand.indexOf(null); if(idx<0)return;
  wand[idx]=sp.dataset.s; refresh();
};
document.getElementById('clrBtn').onclick=()=>{wand=Array(SLOTS).fill(null);refresh();};

// === 游戏逻辑 ===
function parseCombo(){
  let base=null, mods=[];
  wand.forEach(s=>{if(!s)return; if(SPELLS[s].t==='projectile')base=s; else mods.push(s);});
  let dmgMult=1, rMult=1, split=false, homing=false, explode=false, freeze=false;
  mods.forEach(m=>{
    if(m==='split')split=true;
    if(m==='homing')homing=true;
    if(m==='explode')explode=true;
    if(m==='freeze')freeze=true;
    dmgMult*=SPELLS[m].dmgMult;
    rMult*=SPELLS[m].rMult;
  });
  rMult=Math.max(0.5,rMult);
  return{base,dmgMult,rMult,split,homing,explode,freeze};
}

function spawnEnemies(lv){
  enemies=[];
  const count=3+lv*2;
  for(let i=0;i<count;i++){
    const type=MONSTER_TYPES[Math.floor(Math.random()*MONSTER_TYPES.length)];
    enemies.push({
      x:80+Math.random()*640, y:40+Math.random()*200,
      r:20, hp:type.hp+Math.floor(lv/3), maxHp:type.hp+Math.floor(lv/3),
      speed:type.speed+lv*0.08,
      emoji:type.emoji, color:type.color,
      frozen:0, dir:Math.random()*Math.PI*2, changeTimer:60+Math.random()*120,
      attackTimer:120+Math.random()*180
    });
  }
}

function startLevel(lv){
  level=lv; hp=5; maxHp=5; bullets=[]; particles=[]; lasers=[]; enemyFists=[]; cooldown=0;
  spawnEnemies(lv);
  document.getElementById('lvlTxt').textContent=lv;
  document.getElementById('msg').textContent='';
  document.getElementById('nextBtn').style.display='none';
  updateHUD(); running=true;
  if(animId)cancelAnimationFrame(animId);
  loop();
}

function updateHUD(){
  document.getElementById('eneTxt').textContent=enemies.length;
  document.getElementById('hpTxt').textContent=hp+'/'+maxHp;
  const c=parseCombo();
  document.getElementById('cmbTxt').textContent=c.base?wand.filter(s=>s).map(s=>SPELLS[s].n).join('+'):'-';
}

function getPlayerEmoji(){
  const ratio=hp/maxHp;
  if(ratio<=0) return '😵';
  if(ratio<=0.25) return '🤕';
  if(ratio<=0.5) return '😫';
  if(ratio<=0.75) return '😡';
  return '😄';
}

function shoot(tx,ty){
  if(cooldown>0||!running)return;
  const combo=parseCombo(); if(!combo.base)return;
  const base=SPELLS[combo.base];
  cooldown=base.cd;
  const px=400, py=460;
  const ang=Math.atan2(ty-py,tx-px);

  if(combo.base==='laser'){
    const dmg=base.baseDmg*combo.dmgMult;
    const count=combo.split?3:1;
    const spread=0.3;
    for(let i=0;i<count;i++){
      const a=ang+(i-Math.floor(count/2))*spread;
      const lx=px+Math.cos(a)*800;
      const ly=py+Math.sin(a)*800;
      let x2=lx, y2=ly;
      if(combo.homing&&enemies.length>0){
        let closest=enemies[0],minD=Infinity;
        enemies.forEach(e=>{const d=Math.hypot(e.x-px,e.y-py);if(d<minD){minD=d;closest=e;}});
        x2=closest.x; y2=closest.y;
      }
      lasers.push({x1:px,y1:py,x2,y2,life:15,color:combo.freeze?'#00e5ff':'#ffea00',dmg});
      enemies.forEach(e=>{
        if(distToSeg(e.x,e.y,px,py,x2,y2)<e.r+6){
          hitEnemy(e,dmg,combo);
        }
      });
      if(combo.explode&&i===0) explodeAt(x2,y2,combo);
    }
    return;
  }

  const count=combo.split?3:1;
  const spread=0.25;
  for(let i=0;i<count;i++){
    const a=ang+(i-Math.floor(count/2))*spread;
    const spd=7;
    bullets.push({
      x:px,y:py,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
      homing:combo.homing, explode:combo.explode, freeze:combo.freeze,
      r:base.baseR*combo.rMult,
      life:120,
      color:combo.freeze?'#00e5ff':combo.explode?'#ff6b6b':'#a78bfa',
      dmg:base.baseDmg*combo.dmgMult,
      type:combo.base,
      returning:false, returnTimer:0, returnAng:0
    });
  }
}

function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy;
  if(len2===0) return Math.hypot(px-x1,py-y1);
  let t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/len2));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}

function hitEnemy(e,dmg,combo){
  e.hp-=dmg;
  if(combo&&combo.freeze) e.frozen=120;
  for(let i=0;i<6;i++) particles.push({x:e.x,y:e.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:20,color:e.color,r:3});
}

function explodeAt(x,y,combo){
  const radius=70;
  for(let i=0;i<20;i++) particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:30,color:'#ff6b6b',r:4});
  enemies.forEach(e=>{
    if(Math.hypot(e.x-x,e.y-y)<radius+e.r){
      hitEnemy(e,2*combo.dmgMult,combo);
    }
  });
}

function loop(){
  if(!running) return;
  cx.clearRect(0,0,800,500);
  cx.fillStyle='rgba(255,255,255,.15)';
  for(let i=0;i<30;i++){cx.fillRect((i*137+cooldown*0.1)%800,(i*97)%500,1.5,1.5);}
  if(cooldown
