<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法构筑原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .crafting-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(233, 69, 96, 0.3);
        }

        .wand-slots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .slot {
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .slot:hover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .slot.filled {
            border-style: solid;
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
        }

        .slot .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: #ff4757;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .slot:hover .remove-btn {
            opacity: 1;
        }

        .spell-library {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .spell {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .spell:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.5);
            border-color: #fff;
        }

        .spell .icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .spell .name {
            font-size: 12px;
            font-weight: bold;
        }

        .spell.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spell.disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .game-area {
            display: none;
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(233, 69, 96, 0.3);
        }

        #gameCanvas {
            width: 100%;
            height: 500px;
            display: block;
            cursor: crosshair;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .info-value {
            font-weight: bold;
            color: #e94560;
        }

        .message {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            color: #ffd700;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #e94560;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: #e94560;
        }

        .instructions ul {
            margin-left: 20px;
        }

        .instructions li {
            margin-bottom: 5px;
            color: rgba(255, 255, 255, 0.8);
        }

        .combo-preview {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .combo-preview span {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🧙‍♂️ 魔法构筑原型</h1>
    
    <div class="container">
        <div class="instructions">
            <h3>📖 玩法说明</h3>
            <ul>
                <li>点击法术图标，将它们按顺序放入上方的法杖槽位中</li>
                <li>法术会从左到右依次生效，组合出不同的效果</li>
                <li>点击"开始闯关"进入战斗，点击屏幕释放魔法</li>
                <li>消灭所有红色史莱姆即可过关！</li>
            </ul>
        </div>

        <div class="crafting-area" id="craftingArea">
            <div class="wand-slots" id="wandSlots">
                <!-- 槽位将由JS生成 -->
            </div>
            
            <div class="combo-preview" id="comboPreview">
                当前组合：<span>未组合任何法术</span>
            </div>

            <div class="spell-library" id="spellLibrary">
                <div class="spell" data-spell="projectile">
                    <div class="icon">🔮</div>
                    <div class="name">飞弹</div>
                </div>
                <div class="spell" data-spell="split">
                    <div class="icon">✂️</div>
                    <div class="name">分裂</div>
                </div>
                <div class="spell" data-spell="homing">
                    <div class="icon">🎯</div>
                    <div class="name">追踪</div>
                </div>
                <div class="spell" data-spell="explosion">
                    <div class="icon">💥</div>
                    <div class="name">爆炸</div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-primary" id="startBtn" disabled>开始闯关</button>
                <button class="btn btn-secondary" id="clearBtn">清空法术</button>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <canvas id="gameCanvas"></canvas>
            <div class="game-info">
                <div class="info-item">
                    <span class="info-label">敌人剩余：</span>
                    <span class="info-value" id="enemyCount">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">法术组合：</span>
                    <span class="info-value" id="currentCombo">无</span>
                </div>
            </div>
            <div class="message" id="gameMessage"></div>
            <div style="text-align: center; padding: 15px;">
                <button class="btn btn-secondary" id="backBtn">返回构筑</button>
            </div>
        </div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            wandSlots: [null, null, null], // 3个法术槽位
            isPlaying: false,
            enemies: [],
            projectiles: [],
            particles: [],
            player: { x: 400, y: 450 },
            gameLoop: null,
            comboDescription: ''
        };

        // 法术定义
        const spells = {
            projectile: {
                name: '飞弹',
                icon: '🔮',
                description: '发射一枚基础魔法弹',
                type: 'base'
            },
            split: {
                name: '分裂',
                icon: '✂️',
                description: '让下一个法术分裂成3枚',
                type: 'modifier'
            },
            homing: {
                name: '追踪',
                icon: '🎯',
                description: '让下一个法术获得追踪效果',
                type: 'modifier'
            },
            explosion: {
                name: '爆炸',
                icon: '💥',
                description: '让下一个法术产生范围爆炸',
                type: 'modifier'
            }
        };

        // DOM元素
        const wandSlotsEl = document.getElementById('wandSlots');
        const spellLibraryEl = document.getElementById('spellLibrary');
        const startBtn = document.getElementById('startBtn');
        const clearBtn = document.getElementById('clearBtn');
        const craftingArea = document.getElementById('craftingArea');
        const gameArea = document.getElementById('gameArea');
        const gameCanvas = document.getElementById('gameCanvas');
        const ctx = gameCanvas.getContext('2d');
        const enemyCountEl = document.getElementById('enemyCount');
        const currentComboEl = document.getElementById('currentCombo');
        const gameMessageEl = document.getElementById('gameMessage');
        const backBtn = document.getElementById('backBtn');
        const comboPreviewEl = document.getElementById('comboPreview');

        // 初始化槽位
        function initSlots() {
            wandSlotsEl.innerHTML = '';
            gameState.wandSlots.forEach((spell, index) => {
                const slot = document.createElement('div');
                slot.className = `slot ${spell ? 'filled' : ''}`;
                slot.dataset.index = index;
                
                if (spell) {
                    slot.innerHTML = `
                        <div style="text-align: center;">
                            <div style="font-size: 24px;">${spells[spell].icon}</div>
                            <div style="font-size: 10px;">${spells[spell].name}</div>
                        </div>
                        <div class="remove-btn">×</div>
                    `;
                } else {
                    slot.innerHTML = '<div style="color: rgba(255,255,255,0.3); font-size: 12px;">空</div>';
                }
                
                slot.addEventListener('click', () => {
                    if (spell) {
                        // 移除法术
                        gameState.wandSlots[index] = null;
                        updateSlots();
                        updateSpellLibrary();
                        updateComboPreview();
                    }
                });
                
                wandSlotsEl.appendChild(slot);
            });
        }

        // 更新槽位显示
        function updateSlots() {
            const slots = wandSlotsEl.querySelectorAll('.slot');
            slots.forEach((slot, index) => {
                const spell = gameState.wandSlots[index];
                slot.className = `slot ${spell ? 'filled' : ''}`;
                
                if (spell) {
                    slot.innerHTML = `
                        <div style="text-align: center;">
                            <div style="font-size: 24px;">${spells[spell].icon}</div>
                            <div style="font-size: 10px;">${spells[spell].name}</div>
                        </div>
                        <div class="remove-btn">×</div>
                    `;
                } else {
                    slot.innerHTML = '<div style="color: rgba(255,255,255,0.3); font-size: 12px;">空</div>';
                }
            });
            
            // 检查是否可以开始游戏
            const hasBaseSpell = gameState.wandSlots.some(spell => spell && spells[spell].type === 'base');
            startBtn.disabled = !hasBaseSpell;
        }

        // 更新法术库状态
        function updateSpellLibrary() {
            const spellElements = spellLibraryEl.querySelectorAll('.spell');
            spellElements.forEach(el => {
                const spellType = el.dataset.spell;
                const isFilled = gameState.wandSlots.includes(spellType);
                el.classList.toggle('disabled', isFilled);
            });
        }

        // 更新组合预览
        function updateComboPreview() {
            const filledSlots = gameState.wandSlots.filter(s => s !== null);
            if (filledSlots.length === 0) {
                comboPreviewEl.innerHTML = '当前组合：<span>未组合任何法术</span>';
                return;
            }
            
            const comboText = filledSlots.map(s => spells[s].name).join(' + ');
            comboPreviewEl.innerHTML = `当前组合：<span>${comboText}</span>`;
        }

        // 法术库点击事件
        spellLibraryEl.addEventListener('click', (e) => {
            const spellEl = e.target.closest('.spell');
            if (!spellEl || spellEl.classList.contains('disabled')) return;
            
            const spellType = spellEl.dataset.spell;
            const emptyIndex = gameState.wandSlots.findIndex(s => s === null);
            
            if (emptyIndex !== -1) {
                gameState.wandSlots[emptyIndex] = spellType;
                updateSlots();
                updateSpellLibrary();
                updateComboPreview();
            }
        });

        // 清空法术
        clearBtn.addEventListener('click', () => {
            gameState.wandSlots = [null, null, null];
            updateSlots();
            updateSpellLibrary();
            updateComboPreview();
        });

        // 生成组合描述
        function generateComboDescription() {
            const slots = gameState.wandSlots.filter(s => s !== null);
            if (slots.length === 0) return '无';
            
            let description = '';
            let hasSplit = false;
            let hasHoming = false;
            let hasExplosion = false;
            let baseSpell = null;
            
            slots.forEach(spell => {
                if (spells[spell].type === 'base') {
                    baseSpell = spell;
                } else if (spell === 'split') {
                    hasSplit = true;
                } else if (spell === 'homing') {
                    hasHoming = true;
                } else if (spell === 'explosion') {
                    hasExplosion = true;
                }
            });
            
            if (!baseSpell) return '无效组合';
            
            description = spells[baseSpell].name;
            if (hasSplit) description += ' + 分裂';
            if (hasHoming) description += ' + 追踪';
            if (hasExplosion) description += ' + 爆炸';
            
            return description;
        }

        // 开始游戏
        startBtn.addEventListener('click', () => {
            gameState.comboDescription = generateComboDescription();
            currentComboEl.textContent = gameState.comboDescription;
            
            craftingArea.style.display = 'none';
            gameArea.style.display = 'block';
            
            // 设置canvas尺寸
            gameCanvas.width = 800;
            gameCanvas.height = 500;
            
            // 初始化敌人
            initEnemies();
            
            // 开始游戏循环
            gameState.isPlaying = true;
            gameState.gameLoop = requestAnimationFrame(gameLoop);
        });

        // 返回构筑
        backBtn.addEventListener('click', () => {
            gameState.isPlaying = false;
            if (gameState.gameLoop) {
                cancelAnimationFrame(gameState.gameLoop);
            }
            
            gameArea.style.display = 'none';
            craftingArea.style.display = 'block';
            gameMessageEl.textContent = '';
        });

        // 初始化敌人
        function initEnemies() {
            gameState.enemies = [];
            for (let i = 0; i < 5; i++) {
                gameState.enemies.push({
