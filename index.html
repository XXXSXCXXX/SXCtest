<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>魔法构筑 - 闯关小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden}
h1{margin:20px 0;color:#e94560;text-shadow:0 0 10px rgba(233,69,96,.5);font-size:28px}
.container{width:100%;max-width:820px;padding:0 10px}
.crafting{background:rgba(255,255,255,.05);border-radius:15px;padding:20px;margin-bottom:20px;border:2px solid rgba(233,69,96,.3)}
.slots{display:flex;justify-content:center;gap:10px;margin-bottom:15px}
.slot{width:72px;height:72px;background:rgba(0,0,0,.3);border:2px dashed rgba(255,255,255,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s;position:relative;flex-direction:column}
.slot:hover{border-color:#e94560}
.slot.filled{border:2px solid #e94560;background:rgba(233,69,96,.15)}
.slot .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;background:#ff4757;border-radius:50%;font-size:11px;display:none;align-items:center;justify-content:center;cursor:pointer;line-height:18px}
.slot:hover .x{display:flex}
.spells{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.spell{width:76px;height:76px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.3s;border:2px solid transparent;position:relative}
.spell:hover{transform:translateY(-4px);box-shadow:0 4px 12px rgba(102,126,234,.5);border-color:#fff}
.spell .ic{font-size:26px}
.spell .nm{font-size:11px;margin-top:4px}
.spell .tag{position:absolute;top:2px;right:4px;font-size:9px;padding:1px 4px;border-radius:4px;background:rgba(0,0,0,.5)}
.spell.tag-projectile .tag{color:#ff6b6b}
.spell.tag-modifier .tag{color:#4ecdc4}
.spell.off{opacity:.4;pointer-events:none}
.combo{text-align:center;padding:8px;background:rgba(0,0,0,.3);border-radius:8px;margin-bottom:15px;font-size:14px;color:rgba(255,255,255,.7)}
.combo b{color:#ffd700}
.btns{text-align:center}
.btn{padding:10px 28px;border:none;border-radius:25px;font-size:15px;font-weight:bold;cursor:pointer;transition:.3s;margin:5px}
.btn-go{background:linear-gradient(135deg,#e94560,#ff6b6b);color:#fff}
.btn-go:hover{transform:scale(1.05)}
.btn-go:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-back{background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.3)}
.btn-back:hover{background:rgba(255,255,255,.2)}
.game-wrap{display:none;position:relative}
canvas{display:block;background:#0f0f23;border-radius:12px;border:2px solid rgba(233,69,96,.3);cursor:crosshair;width:100%;touch-action:none}
.hud{display:flex;justify-content:space-between;padding:12px 16px;background:rgba(0,0,0,.4);border-radius:0 0 12px 12px;margin-top:-4px}
.hud span{font-size:14px}
.hud b{color:#e94560}
.msg{text-align:center;padding:16px;font-size:20px;color:#ffd700;min-height:52px}
.help{background:rgba(255,255,255,.05);border-radius:10px;padding:14px;margin-bottom:18px;border-left:4px solid #e94560;font-size:13px;line-height:1.8;color:rgba(255,255,255,.8)}
.help h3{color:#e94560;margin-bottom:6px}
#joystick{display:none;position:fixed;bottom:30px;left:30px;width:120px;height:120px;z-index:100;touch-action:none}
#joyBase{width:120px;height:120px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);border-radius:50%;position:relative}
#joyKnob{width:50px;height:50px;background:rgba(233,69,96,.6);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
</style>
</head>
<body>
<h1>🧙‍♂️ 魔法构筑 - 闯关小游戏</h1>
<div class="container">
  <div class="help">
    <h3>📖 玩法</h3>
    ① 点击下方法术图标，按顺序放入法杖槽位（先选飞弹，再加增强）<br>
    ② 法术从左到右依次生效，增强效果可重复叠加<br>
    ③ 点击"开始闯关"，在战斗中<b>点击画面</b>释放魔法<br>
    ④ 消灭所有怪物即可过关！共5关，难度递增<br>
    ⑤ 怪物会发射✊🏻攻击你，注意躲避！<br>
    ⑥ <b>A/D键</b>或<b>左下角摇杆</b>控制左右移动
  </div>
  <div class="crafting" id="craftUI">
    <div class="slots" id="slots"></div>
    <div class="combo" id="combo">当前组合：<b>未选择法术</b></div>
    <div class="spells" id="spellLibrary"></div>
    <div class="btns">
      <button class="btn btn-go" id="goBtn" disabled>开始闯关</button>
      <button class="btn btn-back" id="clrBtn">清空法术</button>
    </div>
  </div>
  <div class="game-wrap" id="gameUI">
    <canvas id="cv" width="800" height="500"></canvas>
    <div class="hud">
      <span>关卡：<b id="lvlTxt">1</b></span>
      <span>敌人：<b id="eneTxt">0</b></span>
      <span>生命：<b id="hpTxt">10</b></span>
      <span>组合：<b id="cmbTxt">-</b></span>
    </div>
    <div class="msg" id="msg"></div>
    <div class="btns" style="margin-bottom:20px;">
      <button class="btn btn-back" id="backBtn">返回构筑</button>
      <button class="btn btn-go" id="nextBtn" style="display:none;">下一关</button>
    </div>
  </div>
  <div id="joystick">
    <div id="joyBase">
      <div id="joyKnob"></div>
    </div>
  </div>
</div>
<script>
// ===================== 常量 =====================
const SLOTS = 5;

const SPELL_LIST = [
  { key:'projectile', n:'飞弹', ic:'🔮', t:'projectile', baseDmg:1, baseR:6, cd:18 },
  { key:'missile',    n:'导弹', ic:'🚀', t:'projectile', baseDmg:2, baseR:8, cd:30 },
  { key:'fist',       n:'拳头', ic:'✊🏻', t:'projectile', baseDmg:1.5, baseR:7, cd:22 },
  { key:'laser',      n:'激光', ic:'⚡', t:'projectile', baseDmg:0.5, baseR:0, cd:45 },
  { key:'split',      n:'分裂', ic:'✂️', t:'modifier', dmgMult:0.7, rMult:0.7 },
  { key:'homing',     n:'追踪', ic:'🎯', t:'modifier', dmgMult:1, rMult:1 },
  { key:'explode',    n:'爆炸', ic:'💥', t:'modifier', dmgMult:1, rMult:1 },
  { key:'freeze',     n:'冰冻', ic:'❄️', t:'modifier', dmgMult:1, rMult:1 },
  { key:'power',      n:'抛瓦', ic:'⬆️', t:'modifier', dmgMult:1.25, rMult:1.25 }
];

const SPELLS = {};
SPELL_LIST.forEach(s => SPELLS[s.key] = s);

const MONSTER_TYPES = [
  { emoji:'👿', hp:1, speed:0.5, color:'#ff4444' },
  { emoji:'👻', hp:1, speed:0.4, color:'#aaaaaa' },
  { emoji:'💀', hp:2, speed:0.35, color:'#dddddd' },
  { emoji:'👽', hp:1, speed:0.6, color:'#44ff44' },
  { emoji:'🤖', hp:3, speed:0.25, color:'#888888' }
];

// ===================== 状态 =====================
let wand = Array(SLOTS).fill(null);
let level = 1, hp = 10, maxHp = 10;
let enemies = [], bullets = [], particles = [], lasers = [], enemyFists = [];
let running = false, animId = null, cooldown = 0;
let playerX = 400, playerSpeed = 4;
let keys = { left:false, right:false };
let joyActive = false, joyDX = 0;
const cv = document.getElementById('cv'), cx = cv.getContext('2d');

// ===================== 构筑界面 =====================
function renderSlots() {
  const el = document.getElementById('slots');
  el.innerHTML = '';
  wand.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'slot' + (s ? ' filled' : '');
    if (s) {
      d.innerHTML = '<div style="font-size:22px">' + SPELLS[s].ic + '</div>'
        + '<div style="font-size:10px">' + SPELLS[s].n + '</div>'
        + '<div class="x">×</div>';
    } else {
      d.innerHTML = '<div style="color:rgba(255,255,255,.3);font-size:12px">空</div>';
    }
    d.onclick = function() {
      if (wand[i]) { wand[i] = null; refresh(); }
    };
    el.appendChild(d);
  });
}

function renderSpellLibrary() {
  const el = document.getElementById('spellLibrary');
  el.innerHTML = '';
  SPELL_LIST.forEach(function(s) {
    const d = document.createElement('div');
    d.className = 'spell tag-' + s.t;
    d.setAttribute('data-s', s.key);
    d.innerHTML = '<div class="ic">' + s.ic + '</div>'
      + '<div class="nm">' + s.n + '</div>'
      + '<div class="tag">' + (s.t === 'projectile' ? '飞弹' : '增强') + '</div>';
    el.appendChild(d);
  });
}

function refresh() {
  renderSlots();
  // 更新法术可用性
  var spellEls = document.querySelectorAll('#spellLibrary .spell');
  for (var i = 0; i < spellEls.length; i++) {
    var e = spellEls[i];
    var key = e.getAttribute('data-s');
    var s = SPELLS[key];
    var off = false;
    if (s.t === 'projectile') {
      // 已有一个飞弹类型则禁用其他飞弹
      off = wand.some(function(w) { return w && SPELLS[w].t === 'projectile'; });
    }
    if (off) { e.classList.add('off'); } else { e.classList.remove('off'); }
  }
  // 更新组合显示
  var filled = wand.filter(function(s) { return s; });
  var comboEl = document.getElementById('combo');
  if (filled.length) {
    comboEl.innerHTML = '当前组合：<b>' + filled.map(function(s) { return SPELLS[s].n; }).join(' → ') + '</b>';
  } else {
    comboEl.innerHTML = '当前组合：<b>未选择法术</b>';
  }
  // 启用/禁用开始按钮
  var hasProjectile = wand.some(function(s) { return s && SPELLS[s].t === 'projectile'; });
  document.getElementById('goBtn').disabled = !hasProjectile;
}

// 法术库点击事件
document.getElementById('spellLibrary').addEventListener('click', function(e) {
  var sp = e.target.closest('.spell');
  if (!sp || sp.classList.contains('off')) return;
  var key = sp.getAttribute('data-s');
  var idx = wand.indexOf(null);
  if (idx < 0) return;
  wand[idx] = key;
  refresh();
});

// 清空按钮
document.getElementById('clrBtn').addEventListener('click', function() {
  wand = Array(SLOTS).fill(null);
  refresh();
});

// ===================== 组合解析 =====================
function parseCombo() {
  var base = null, mods = [];
  wand.forEach(function(s) {
    if (!s) return;
    if (SPELLS[s].t === 'projectile') base = s;
    else mods.push(s);
  });
  var dmgMult = 1, rMult = 1;
  var split = false, homing = false, explode = false, freeze = false;
  mods.forEach(function(m) {
    if (m === 'split') split = true;
    if (m === 'homing') homing = true;
    if (m === 'explode') explode = true;
    if (m === 'freeze') freeze = true;
    dmgMult *= SPELLS[m].dmgMult;
    rMult *= SPELLS[m].rMult;
  });
  rMult = Math.max(0.5, rMult);
  return { base:base, dmgMult:dmgMult, rMult:rMult, split:split, homing:homing, explode:explode, freeze:freeze };
}

// ===================== 敌人生成 =====================
function spawnEnemies(lv) {
  enemies = [];
  var count = 3 + lv * 2;
  for (var i = 0; i < count; i++) {
    var type = MONSTER_TYPES[Math.floor(Math.random() * MONSTER_TYPES.length)];
    enemies.push({
      x: 80 + Math.random() * 640,
      y: 40 + Math.random() * 200,
      r: 20,
      hp: type.hp + Math.floor(lv / 3),
      maxHp: type.hp + Math.floor(lv / 3),
      speed: type.speed + lv * 0.08,
      emoji: type.emoji,
      color: type.color,
      frozen: 0,
      dir: Math.random() * Math.PI * 2,
      changeTimer: 60 + Math.random() * 120,
      attackTimer: 120 + Math.random() * 180
    });
  }
}

// ===================== 工具函数 =====================
function distToSeg(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(px - x1, py - y1);
  var t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lenSq));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function addParticles(x, y, color, count) {
  for (var i = 0; i < count; i++) {
    var ang = Math.random() * Math.PI * 2;
    var spd = 1 + Math.random() * 3;
    particles.push({
      x:x, y:y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life: 20 + Math.random() * 20,
      color: color,
      r: 2 + Math.random() * 3
    });
  }
}

function explodeAt(x, y, combo) {
  addParticles(x, y, '#ff6b35', 20);
  var radius = 60;
  var dmg = 1.5 * combo.dmgMult;
  enemies.forEach(function(e) {
    if (Math.hypot(e.x - x, e.y - y) < radius + e.r) {
      hitEnemy(e, dmg, combo);
    }
  });
}

function hitEnemy(e, dmg, combo) {
  e.hp -= dmg;
  addParticles(e.x, e.y, e.color, 5);
  if (combo.freeze) e.frozen = 120;
  if (e.hp <= 0) {
    addParticles(e.x, e.y, '#ffd700', 15);
    var idx = enemies.indexOf(e);
    if (idx >= 0) enemies.splice(idx, 1);
  }
}

// ===================== 射击 =====================
function shoot(tx, ty) {
  if (cooldown > 0 || !running) return;
  var combo = parseCombo();
  if (!combo.base) return;
  var base = SPELLS[combo.base];
  cooldown = base.cd;
  var px = playerX, py = 460;
  var ang = Math.atan2(ty - py, tx - px);

  // 激光特殊处理
  if (combo.base === 'laser') {
    var dmg = base.baseDmg * combo.dmgMult;
    var count = combo.split ? 3 : 1;
    var spread = 0.3;
    for (var i = 0; i < count; i++) {
      var a = ang + (i - Math.floor(count / 2)) * spread;
      var lx = px + Math.cos(a) * 800;
      var ly = py + Math.sin(a) * 800;
      if (combo.homing && enemies.length > 0) {
        var closest = enemies[0], minD = Infinity;
        enemies.forEach(function(e) {
          var d = Math.hypot(e.x - px, e.y - py);
          if (d < minD) { minD = d; closest = e; }
        });
        lx = closest.x; ly = closest.y;
      }
      lasers.push({ x1:px, y1:py, x2:lx, y2:ly, life:15, color: combo.freeze ? '#00e5ff' : '#ffea00', dmg:dmg });
      enemies.forEach(function(e) {
        if (distToSeg(e.x, e.y, px, py, lx, ly) < e.r + 6) {
          hitEnemy(e, dmg, combo);
        }
      });
      if (combo.explode && i === 0) explodeAt(lx, ly, combo);
    }
    return;
  }

  // 普通弹道（飞弹/导弹/拳头）
  var bulletCount = combo.split ? 3 : 1;
  var bulletSpread = 0.25;
  for (var j = 0; j < bulletCount; j++) {
    var ba = ang + (j - Math.floor(bulletCount / 2)) * bulletSpread;
    var spd = 7;
    if (combo.base === 'missile') spd *= 0.5;
    if (combo.base === 'fist') spd *= 0.75;

    var bulletR = (base.baseR || 6) * combo.rMult;

    bullets.push({
      x: px, y: py,
      vx: Math.cos(ba) * spd,
      vy: Math.sin(ba) * spd,
      homing: combo.homing,
      explode: combo.explode,
      freeze: combo.freeze,
      r: bulletR,
      dmg: base.baseDmg * combo.dmgMult,
      emoji: base.ic,
      life: 120
    });
  }
}

// ===================== 游戏循环 =====================
function startLevel(lv) {
  level = lv;
  hp = maxHp;
  playerX = 400;
  bullets = []; particles = []; lasers = []; enemyFists = [];
  cooldown = 0;
  spawnEnemies(lv);
  document.getElementById('lvlTxt').textContent = lv;
  document.getElementById('msg').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';
  updateHUD();
  running = true;
  if (animId) cancelAnimationFrame(animId);
  loop();
}

function updateHUD() {
  document.getElementById('eneTxt').textContent = enemies.length;
  document.getElementById('hpTxt').textContent = hp + '/' + maxHp;
  var c = parseCombo();
  document.getElementById('cmbTxt').textContent = c.base
    ? wand.filter(function(s){return s;}).map(function(s){return SPELLS[s].n;}).join('+')
    : '-';
}

function getPlayerEmoji() {
  var ratio = hp / maxHp;
  if (ratio <= 0) return '😵';
  if (ratio <= 0.25) return '🤕';
  if (ratio <= 0.5) return '😫';
  if (ratio <= 0.75) return '😡';
  return '😄';
}

function update() {
  // 玩家移动
  if (keys.left) playerX -= playerSpeed;
  if (keys.right) playerX += playerSpeed;
  if (joyActive) playerX += joyDX * playerSpeed;
  playerX = Math.max(20, Math.min(780, playerX));

  // 冷却
  if (cooldown > 0) cooldown--;

  // 更新子弹
  for (var i = bullets.length - 1; i >= 0; i--) {
    var b = bullets[i];
    // 追踪
    if (b.homing && enemies.length > 0) {
      var closest = enemies[0], minD = Infinity;
      enemies.forEach(function(e) {
        var d = Math.hypot(e.x - b.x, e.y - b.y);
        if (d < minD) { minD = d; closest = e; }
      });
      var ta = Math.atan2(closest.y - b.y, closest.x - b.x);
      var ca = Math.atan2(b.vy, b.vx);
      var diff = ta - ca;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      ca += diff * 0.08;
      var speed = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(ca) * speed;
      b.vy = Math.sin(ca) * speed;
    }
    b.x += b.vx;
    b.y += b.vy;
    b.life--;

    // 碰撞检测
    var hit = false;
    for (var j = enemies.length - 1; j >= 0; j--) {
      var e = enemies[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < b.r + e.r) {
        hitEnemy(e, b.dmg, { freeze: b.freeze });
        if (b.explode) explodeAt(b.x, b.y, { dmgMult:1, freeze:b.freeze });
        hit = true;
        break;
      }
    }
    if (hit || b.life <= 0 || b.x < -20 || b.x > 820 || b.y < -20 || b.y > 520) {
      bullets.splice(i, 1);
    }
  }

  // 更新激光
  for (var li = lasers.length - 1; li >= 0; li--) {
    lasers[li].life--;
    if (lasers[li].life <= 0) lasers.splice(li, 1);
  }

  // 更新敌人
  enemies.forEach(function(e) {
    if (e.frozen > 0) { e.frozen--; return; }
    e.changeTimer--;
    if (e.changeTimer <= 0) {
      e.dir = Math.atan2(460 - e.y, playerX - e.x) + (Math.random() - 0.5) * 1.5;
      e.changeTimer = 60 + Math.random() * 120;
    }
    e.x += Math.cos(e.dir) * e.speed;
    e.y += Math.sin(e.dir) * e.speed;
    e.x = Math.max(20, Math.min(780, e.x));
    e.y = Math.max(20, Math.min(400, e.y));

    // 敌人攻击
    e.attackTimer--;
    if (e.attackTimer <= 0) {
      e.attackTimer = 150 + Math.random() * 200;
      var ea = Math.atan2(460 - e.y, playerX - e.x);
      enemyFists.push({
        x: e.x, y: e.y,
        vx: Math.cos(ea) * 3,
        vy: Math.sin(ea) * 3,
        r: 8, life: 150
      });
    }
  });

  // 更新敌人拳头
  for (var fi = enemyFists.length - 1; fi >= 0; fi--) {
    var f = enemyFists[fi];
    f.x += f.vx; f.y += f.vy; f.life--;
    // 碰撞玩家
    if (Math.abs(f.x - playerX) < f.r + 15 && Math.abs(f.y - 460) < f.r + 15) {
      hp--;
      addParticles(playerX, 460, '#ff0000', 8);
      enemyFists.splice(fi, 1);
      if (hp <= 0) { gameOver(); return; }
      continue;
    }
    if (f.life <= 0 || f.x < -20 || f.x > 820 || f.y < -20 || f.y > 520) {
      enemyFists.splice(fi, 1);
    }
  }

  // 更新粒子
  for (var pi = particles.length - 1; pi >= 0; pi--) {
    var p = particles[pi];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life--;
    if (p.life <= 0) particles.splice(pi, 1);
  }

  // 检查过关
  if (enemies.length === 0 && running) {
    running = false;
    if (level >= 5) {
      document.getElementById('msg').textContent = '🎉 恭喜通关！你是最强法师！';
    } else {
      document.getElementById('msg').textContent = '✅ 第' + level + '关通过！';
      document.getElementById('nextBtn').style.display = 'inline-block';
    }
  }

  updateHUD();
}

function draw() {
  cx.clearRect(0, 0, 800, 500);

  // 背景网格
  cx.strokeStyle = 'rgba(255,255,255,0.03)';
  cx.lineWidth = 1;
  for (var gx = 0; gx < 800; gx += 40) { cx.beginPath(); cx.moveTo(gx, 0); cx.lineTo(gx, 500); cx.stroke(); }
  for (var gy = 0; gy < 500; gy += 40) { cx.beginPath(); cx.moveTo(0, gy); cx.lineTo(800, gy); cx.stroke(); }

  // 激光
  lasers.forEach(function(l) {
    cx.save();
    cx.globalAlpha = l.life / 15;
    cx.strokeStyle = l.color;
    cx.lineWidth = 4;
    cx.shadowColor = l.color;
    cx.shadowBlur = 15;
    cx.beginPath(); cx.moveTo(l.x1, l.y1); cx.lineTo(l.x2, l.y2); cx.stroke();
    cx.restore();
  });

  // 子弹
  bullets.forEach(function(b) {
    cx.font = (b.r * 2.5) + 'px serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText(b.emoji, b.x, b.y);
  });

  // 敌人拳头
  enemyFists.forEach(function(f) {
    cx.font = '16px serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('✊🏻', f.x, f.y);
  });

  // 敌人
  enemies.forEach(function(e) {
    cx.font = '30px serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    if (e.frozen > 0) {
      cx.save();
      cx.globalAlpha = 0.6;
      cx.fillText(e.emoji, e.x, e.y);
      cx.fillStyle = '#00e5ff';
      cx.font = '12px sans-serif';
      cx.fillText('❄️', e.x + 15, e.y - 15);
      cx.restore();
    } else {
      cx.fillText(e.emoji, e.x, e.y);
    }
    // 血条
    if (e.hp < e.maxHp) {
      var bw = 30, bh = 4;
      cx.fillStyle = '#333';
      cx.fillRect(e.x - bw/2, e.y - 22, bw, bh);
      cx.fillStyle = '#ff4444';
      cx.fillRect(e.x - bw/2, e.y - 22, bw * (e.hp / e.maxHp), bh);
    }
  });

  // 粒子
  particles.forEach(function(p) {
    cx.save();
    cx.globalAlpha = p.life / 40;
    cx.fillStyle = p.color;
    cx.beginPath();
    cx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    cx.fill();
    cx.restore();
  });

  // 玩家
  cx.font = '36px serif';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillText(getPlayerEmoji(), playerX, 460);

  // 冷却指示
  if (cooldown > 0) {
    cx.fillStyle = 'rgba(233,69,96,0.5)';
    cx.fillRect(playerX - 15, 480, 30 * (cooldown / 30), 3);
  }
}

function loop() {
  if (!running) { draw(); return; }
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  document.getElementById('msg').textContent = '💀 你被击败了！点击"返回构筑"重新开始';
  draw();
}

// ===================== 事件绑定 =====================
// 开始闯关
document.getElementById('goBtn').addEventListener('click', function() {
  document.getElementById('craftUI').style.display = 'none';
  document.getElementById('gameUI').style.display = 'block';
  if ('ontouchstart' in window) document.getElementById('joystick').style.display = 'block';
  startLevel(1);
});

// 返回构筑
document.getElementById('backBtn').addEventListener('click', function() {
  running = false;
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('craftUI').style.display = 'block';
  document.getElementById('gameUI').style.display = 'none';
  document.getElementById('joystick').style.display = 'none';
  wand = Array(SLOTS).fill(null);
  refresh();
});

// 下一关
document.getElementById('nextBtn').addEventListener('click', function() {
  startLevel(level + 1);
});

// 画布点击射击
cv.addEventListener('click', function(e) {
  var rect = cv.getBoundingClientRect();
  var scaleX = cv.width / rect.width;
  var scaleY = cv.height / rect.height;
  var tx = (e.clientX - rect.left) * scaleX;
  var ty = (e.clientY - rect.top) * scaleY;
  shoot(tx, ty);
});

// 键盘控制
document.addEventListener('keydown', function(e) {
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
});
document.addEventListener('keyup', function(e) {
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
});

// 摇杆控制
(function() {
  var base = document.getElementById('joyBase');
  var knob = document.getElementById('joyKnob');
  var joyTouchId = null;
  var baseRect;

  base.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    joyTouchId = t.identifier;
    baseRect = base.getBoundingClientRect();
    joyActive = true;
    updateJoy(t);
  });

  document.addEventListener('touchmove', function(e) {
    if (!joyActive) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        updateJoy(e.changedTouches[i]);
        break;
      }
    }
  });

  document.addEventListener('touchend', function(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        joyActive = false;
        joyDX = 0;
        knob.style.transform = 'translate(-50%,-50%)';
        joyTouchId = null;
        break;
      }
    }
  });

  function updateJoy(touch) {
    var cx = baseRect.left + baseRect.width / 2;
    var dx = touch.clientX - cx;
    var maxR = 35;
    dx = Math.max(-maxR, Math.min(maxR, dx));
    knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), -50%)';
    joyDX = dx / maxR;
  }
})();

// ===================== 初始化 =====================
renderSpellLibrary();
renderSlots();
refresh();
</script>
